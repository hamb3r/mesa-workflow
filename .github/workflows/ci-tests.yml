name: Automation Self-Tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/**"
      - "pyproject.toml"
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML pytest ruff
      - name: Lint with ruff
        run: ruff check scripts tests
      - name: Validate YAML configs
        run: |
          python -c '
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from mesa_canary.config import load_global_config, load_all_targets
          root = Path(".")
          g = load_global_config(root)
          t = load_all_targets(root)
          assert t, "No enabled targets found"
          print("Loaded global config & targets:", list(t.keys()))
          '
      - name: Run unit tests
        run: pytest -v
