name: Canary — DirectX-Headers (D3D12 / DZN / Video / MediaFoundation)

on:
  workflow_call:
    inputs:
      matrix_json:
        description: "JSON matrix object ({include: [...]}) generated by monitor.yml"
        required: true
        type: string

  workflow_dispatch:
    inputs:
      mesa_refs:
        description: "Comma-separated Mesa branches, tags, or SHAs (e.g. mesa-26.2.7 or main,staging/26.2)"
        required: true
        default: "mesa-26.2.7"
        type: string
      dxheaders_ref:
        description: "microsoft/DirectX-Headers tag, branch, or SHA (e.g. v1.620.1, v1.619.1, main)"
        required: true
        default: "v1.620.1"
        type: string
      toolchains:
        description: "Comma-separated toolchains (msvc,clang-cl,msys2-ucrt64,msys2-mingw64,msys2-clang64,linux-gcc,linux-clang) or 'all'"
        required: false
        default: "all"
        type: string
      channel:
        description: "Channel label for reporting"
        required: false
        default: "manual"
        type: choice
        options:
          - manual
          - release
          - preview
          - main
      run_backport_check:
        description: "Run Stage 2 backport auto-diagnostics on failed non-main builds"
        required: false
        default: true
        type: boolean
      runner_provider:
        description: "Optional runner provider override (leave blank for config/global.yaml default)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.call_prep.outputs.has_work || steps.manual_prep.outputs.has_work }}
      matrix: ${{ steps.call_prep.outputs.matrix || steps.manual_prep.outputs.matrix }}
    steps:
      - name: Pass through matrix from workflow_call
        id: call_prep
        if: github.event_name == 'workflow_call'
        env:
          MATRIX_JSON: ${{ inputs.matrix_json }}
        run: |
          if [ -n "$MATRIX_JSON" ]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "matrix<<MESA_CANARY_EOF"
            echo "$MATRIX_JSON"
            echo "MESA_CANARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup Python (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Resolve manual build matrix
        id: manual_prep
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESA_REFS: ${{ inputs.mesa_refs }}
          DXHEADERS_REF: ${{ inputs.dxheaders_ref }}
          TOOLCHAINS: ${{ inputs.toolchains }}
          CHANNEL: ${{ inputs.channel }}
          RUNNER_PROVIDER: ${{ inputs.runner_provider }}
        run: |
          args=(
            --target directx-headers
            --mesa-refs "$MESA_REFS"
            --dep-ref "$DXHEADERS_REF"
            --toolchains "$TOOLCHAINS"
            --channel "$CHANNEL"
          )
          if [ -n "$RUNNER_PROVIDER" ]; then
            args+=(--runner-provider "$RUNNER_PROVIDER")
          fi
          python scripts/cli.py plan-manual "${args[@]}"

  build:
    name: "${{ matrix.channel }} | ${{ matrix.mesa_ref }} | ${{ matrix.dep_ref }} | ${{ matrix.toolchain }}"
    needs: prepare
    if: needs.prepare.outputs.has_work == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Windows MSVC / clang-cl setup
      # ------------------------------------------------------------------
      - name: Setup MSVC Developer Environment
        if: matrix.kind == 'msvc' || matrix.kind == 'clang-cl'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python (Windows MSVC/clang-cl)
        if: matrix.kind == 'msvc' || matrix.kind == 'clang-cl'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python build tools (Windows MSVC/clang-cl)
        if: matrix.kind == 'msvc' || matrix.kind == 'clang-cl'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade meson ninja mako pyyaml packaging

      - name: Cache Windows native build tools (winflexbison + SDK BuildTools tracewpp)
        if: matrix.kind == 'msvc' || matrix.kind == 'clang-cl'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/canary-tools
          key: win-tools-v1-${{ runner.os }}

      - name: Setup winflexbison, tracewpp, and clang-cl
        if: matrix.kind == 'msvc' || matrix.kind == 'clang-cl'
        shell: pwsh
        run: |
          $params = @{
            ToolsDir     = "${{ runner.temp }}\canary-tools"
            NeedTraceWpp = $true
          }
          if ("${{ matrix.kind }}" -eq "clang-cl") {
            $params["NeedClangCl"] = $true
          }
          & .\scripts\setup_windows_tools.ps1 @params

      - name: Setup sccache (Windows MSVC/clang-cl & Linux)
        if: matrix.kind == 'msvc' || matrix.kind == 'clang-cl' || matrix.os == 'linux'
        uses: mozilla-actions/sccache-action@v0.0.9

      # ------------------------------------------------------------------
      # Windows MSYS2 setup (UCRT64 / MINGW64 / CLANG64)
      # Intentionally does NOT install directx-headers so subproject wins.
      # ------------------------------------------------------------------
      - name: Setup MSYS2 (${{ matrix.msys2_sys }})
        if: matrix.kind == 'msys2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys2_sys }}
          update: true
          install: >-
            git
            flex
            bison
            ${{ matrix.toolchain == 'msys2-clang64' && format('{0}-clang {0}-lld', matrix.msys2_prefix) || format('{0}-gcc', matrix.msys2_prefix) }}
            ${{ matrix.msys2_prefix }}-meson
            ${{ matrix.msys2_prefix }}-ninja
            ${{ matrix.msys2_prefix }}-python
            ${{ matrix.msys2_prefix }}-python-mako
            ${{ matrix.msys2_prefix }}-python-yaml
            ${{ matrix.msys2_prefix }}-python-packaging
            ${{ matrix.msys2_prefix }}-zlib
            ${{ matrix.msys2_prefix }}-pkgconf
            ${{ matrix.msys2_prefix }}-sccache

      # ------------------------------------------------------------------
      # Linux setup (GCC / Clang — WSL D3D12 + DZN + X11 + Wayland)
      # ------------------------------------------------------------------
      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          extra_pkgs=""
          if [ "${{ matrix.toolchain }}" = "linux-clang" ]; then
            extra_pkgs="clang lld"
          fi
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config flex bison \
            zlib1g-dev libexpat1-dev libelf-dev libdrm-dev libva-dev \
            libx11-dev libxext-dev libxdamage-dev libxfixes-dev libxshmfence-dev \
            libxxf86vm-dev libxrandr-dev libx11-xcb-dev \
            libxcb-glx0-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-sync-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            x11proto-dev \
            libwayland-dev libwayland-egl-backend-dev wayland-protocols libwayland-bin \
            $extra_pkgs

      - name: Setup Python (Linux)
        if: matrix.os == 'linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python build tools (Linux)
        if: matrix.os == 'linux'
        run: python -m pip install --disable-pip-version-check --upgrade meson mako pyyaml packaging

      # ------------------------------------------------------------------
      # Shared compilation & Meson wrap caches (all variants)
      # ------------------------------------------------------------------
      - name: Cache sccache directory
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-v1-${{ matrix.toolchain }}-${{ matrix.mesa_ref }}-${{ github.run_id }}
          restore-keys: |
            sccache-v1-${{ matrix.toolchain }}-${{ matrix.mesa_ref }}-
            sccache-v1-${{ matrix.toolchain }}-

      - name: Cache Meson subprojects packagecache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mesa-packagecache
          key: mesa-pkgcache-v1-${{ matrix.os }}-${{ matrix.mesa_ref }}
          restore-keys: |
            mesa-pkgcache-v1-${{ matrix.os }}-

      # ------------------------------------------------------------------
      # Build execution
      # ------------------------------------------------------------------
      - name: Build Mesa (Windows MSVC / clang-cl)
        if: matrix.kind == 'msvc' || matrix.kind == 'clang-cl'
        shell: pwsh
        env:
          SCCACHE_DIR: ${{ runner.temp }}\sccache
          SCCACHE_CACHE_SIZE: "1G"
          MESA_REF: ${{ matrix.mesa_ref }}
          DEP_REF: ${{ matrix.dep_ref }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          CHANNEL: ${{ matrix.channel }}
          SEVERITY: ${{ matrix.severity }}
          WORK_DIR: ${{ runner.temp }}\mesa-work
          OUT_DIR: ${{ github.workspace }}\_out
          PKGCACHE_DIR: ${{ runner.temp }}\mesa-packagecache
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/cli.py build `
            --target directx-headers `
            --mesa-ref "$env:MESA_REF" `
            --dep-ref "$env:DEP_REF" `
            --toolchain "$env:TOOLCHAIN" `
            --channel "$env:CHANNEL" `
            --severity "$env:SEVERITY" `
            --work-dir "$env:WORK_DIR" `
            --output-dir "$env:OUT_DIR" `
            --packagecache-dir "$env:PKGCACHE_DIR" `
            --run-url "$env:RUN_URL"

      - name: Build Mesa (Windows MSYS2 ${{ matrix.msys2_sys }})
        if: matrix.kind == 'msys2'
        shell: msys2 {0}
        env:
          SCCACHE_DIR: ${{ runner.temp }}\sccache
          SCCACHE_CACHE_SIZE: "1G"
          MESA_REF: ${{ matrix.mesa_ref }}
          DEP_REF: ${{ matrix.dep_ref }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          CHANNEL: ${{ matrix.channel }}
          SEVERITY: ${{ matrix.severity }}
          WORK_DIR: ${{ runner.temp }}\mesa-work
          OUT_DIR: ${{ github.workspace }}\_out
          PKGCACHE_DIR: ${{ runner.temp }}\mesa-packagecache
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/cli.py build \
            --target directx-headers \
            --mesa-ref "$MESA_REF" \
            --dep-ref "$DEP_REF" \
            --toolchain "$TOOLCHAIN" \
            --channel "$CHANNEL" \
            --severity "$SEVERITY" \
            --work-dir "$WORK_DIR" \
            --output-dir "$OUT_DIR" \
            --packagecache-dir "$PKGCACHE_DIR" \
            --run-url "$RUN_URL"

      - name: Build Mesa (Linux)
        if: matrix.os == 'linux'
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          SCCACHE_CACHE_SIZE: "1G"
          MESA_REF: ${{ matrix.mesa_ref }}
          DEP_REF: ${{ matrix.dep_ref }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          CHANNEL: ${{ matrix.channel }}
          SEVERITY: ${{ matrix.severity }}
          WORK_DIR: ${{ runner.temp }}/mesa-work
          OUT_DIR: ${{ github.workspace }}/_out
          PKGCACHE_DIR: ${{ runner.temp }}/mesa-packagecache
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/cli.py build \
            --target directx-headers \
            --mesa-ref "$MESA_REF" \
            --dep-ref "$DEP_REF" \
            --toolchain "$TOOLCHAIN" \
            --channel "$CHANNEL" \
            --severity "$SEVERITY" \
            --work-dir "$WORK_DIR" \
            --output-dir "$OUT_DIR" \
            --packagecache-dir "$PKGCACHE_DIR" \
            --run-url "$RUN_URL"

      # ------------------------------------------------------------------
      # Upload result.json + compact error.log before reflecting status
      # ------------------------------------------------------------------
      - name: Upload cell result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-result-${{ matrix.artifact_slug }}
          path: _out/**
          retention-days: 14
          if-no-files-found: warn

      - name: Reflect build status (Windows)
        if: always() && matrix.os == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "_out/result.json")) {
            Write-Error "Missing _out/result.json"
            exit 1
          }
          $r = Get-Content -Raw "_out/result.json" | ConvertFrom-Json
          if ($r.status -ne "PASS") {
            Write-Error "Canary build FAILED ($($r.error_stage)): $($r.error_summary)"
            exit 1
          }

      - name: Reflect build status (Linux)
        if: always() && matrix.os == 'linux'
        run: |
          python3 - <<'PY'
          import json, sys
          with open("_out/result.json", encoding="utf-8") as fh:
              r = json.load(fh)
          if r.get("status") != "PASS":
              stage = r.get("error_stage")
              summary = r.get("error_summary")
              print(f"::error::Canary build FAILED ({stage}): {summary}")
              sys.exit(1)
          PY

  # Consolidated summary + optional Stage 2 backport diagnosis for manual smoke-test runs
  manual-summary:
    name: Manual Run Summary & Backport Diagnosis
    needs: [prepare, build]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Download all cell artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: canary-result-*
          path: _artifacts

      - name: Summarize results & diagnose backports
        env:
          RUN_BP: ${{ inputs.run_backport_check }}
        run: |
          args=(--artifacts-dir _artifacts)
          if [ "$RUN_BP" = "true" ]; then
            args+=(--diagnose-backport)
          fi
          python scripts/cli.py summarize-manual "${args[@]}"
